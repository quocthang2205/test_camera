# Build bản chạy cho Linux, macOS, Windows và đăng lên GitHub Releases.
# - Gắn tag v* (vd: git tag v1.0.0 && git push origin v1.0.0) -> build + tự tạo Release.
# - Hoặc Actions > Run workflow, nhập "tag" (vd: v1.0.0, KHÔNG có khoảng trắng) để build + tạo Release; để trống thì chỉ build.
name: build-app
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag phát hành (vd: v1.0.0, không dấu cách). Để trống = chỉ build, không release"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, artifact: camera-checker-linux}
          - {os: macos-latest, artifact: camera-checker-macos}
          - {os: windows-latest, artifact: camera-checker-windows}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements-build.txt
      - run: python scripts/build_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-22.04
    steps:
      - name: Xác định tag (tự đổi khoảng trắng thành dấu gạch ngang)
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then RAW="$GITHUB_REF_NAME"; else RAW="$INPUT_TAG"; fi
          TAG="$(echo "$RAW" | sed -E 's/[[:space:]]+/-/g; s/[^A-Za-z0-9._-]//g')"
          if [ -z "$TAG" ]; then echo "Tag không hợp lệ: '$RAW'"; exit 1; fi
          echo "Dùng tag: $TAG"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Nén từng bản thành file .zip
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          mkdir -p release
          for d in artifacts/*/; do
            n="$(basename "$d")"
            (cd "$d" && zip -r -q "$GITHUB_WORKSPACE/release/$n-$TAG.zip" .)
          done
          ls -lh release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: release/*.zip
          generate_release_notes: true
