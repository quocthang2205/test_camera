<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiểm tra pixel lỗi camera</title>
<style>
  :root { --bg:#f5f5f2; --card:#fff; --ink:#1c1c1e; --muted:#6e6e73; --line:#dcdcd7; --accent:#0a64d6; --warn-bg:#fff4d6; --err-bg:#ffe1df; color-scheme:light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151517; --card:#1f1f22; --ink:#ececee; --muted:#9a9aa0; --line:#34343a; --accent:#4c9bff; --warn-bg:#3a3117; --err-bg:#43201e; color-scheme:dark; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:28px 16px 60px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .tabs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .tabs button { border:1px solid var(--line); background:var(--card); color:var(--ink); padding:8px 16px; border-radius:999px; cursor:pointer; font:inherit; }
  .tabs button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .help { color:var(--muted); margin:0 0 16px; min-height:1.5em; }
  .slots { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:12px; }
  .drop { position:relative; border:2px dashed var(--line); border-radius:12px; background:var(--card); padding:16px; min-height:130px; cursor:pointer; transition:border-color .15s, background .15s; }
  .drop.over { border-color:var(--accent); background:color-mix(in srgb, var(--accent) 8%, var(--card)); }
  .drop.ok { border-style:solid; border-color:#30d158; }
  .drop b { display:block; }
  .drop .hint { color:var(--muted); font-size:13px; }
  .drop .count { margin-top:8px; font-weight:600; }
  .drop .clear { position:absolute; top:8px; right:10px; border:0; background:none; color:var(--muted); cursor:pointer; font-size:18px; }
  .drop input { display:none; }
  .params { display:flex; gap:12px; flex-wrap:wrap; margin-top:14px; }
  .params label { display:flex; flex-direction:column; font-size:13px; color:var(--muted); }
  .params select { margin-top:4px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); font:inherit; width:180px; }
  .params input { margin-top:4px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); font:inherit; width:180px; }
  .actions { margin:18px 0; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .primary { background:var(--accent); color:#fff; border:0; padding:11px 26px; border-radius:10px; font:600 15px system-ui, sans-serif; cursor:pointer; }
  .primary:disabled { opacity:.45; cursor:not-allowed; }
  .msg { padding:10px 14px; border-radius:10px; margin:8px 0; }
  .msg.warn { background:var(--warn-bg); } .msg.err { background:var(--err-bg); }
  .notes { color:var(--muted); font-size:13px; margin:6px 0 14px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:12px; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .card h3 { margin:0 0 6px; font-size:15px; display:flex; align-items:center; gap:8px; }
  .dot { width:12px; height:12px; border-radius:50%; display:inline-block; }
  .big { font-size:30px; font-weight:700; line-height:1.1; }
  .stats { color:var(--muted); font-size:13px; }
  .card button { margin-top:8px; border:1px solid var(--line); background:none; color:var(--ink); border-radius:8px; padding:4px 10px; cursor:pointer; font:inherit; font-size:13px; }
  .overlay { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px; margin-bottom:16px; }
  .overlay img { width:100%; display:block; border-radius:6px; }
  .overlay p { color:var(--muted); font-size:13px; margin:8px 2px 0; }
  details { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin-bottom:10px; }
  .tbl { overflow-x:auto; max-height:360px; }
  table { border-collapse:collapse; width:100%; font-size:13px; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:4px 10px; border-bottom:1px solid var(--line); }
  .spin { width:18px; height:18px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:r .8s linear infinite; }
  @keyframes r { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<main>
  <h1>Kiểm tra pixel lỗi camera</h1>
  <p class="sub">Chọn loại kiểm tra → kéo thả ảnh vào từng ô → bấm <b>Phân tích</b>.</p>
  <div class="tabs" id="tabs"></div>
  <p class="help" id="help"></p>
  <div class="slots" id="slots"></div>
  <div class="params">
    <label id="frames-box">Số ảnh phân tích<select id="frames">
      <option value="1">1 ảnh (kiểm nhanh)</option><option value="3">3 ảnh</option>
      <option value="5" selected>5 ảnh (chuẩn)</option></select></label>
    <label>ISO (bỏ trống = đọc từ EXIF)<input id="iso" type="number" min="1" step="1" placeholder="vd: 100"></label>
    <label>Bitrate (ảnh không có, nhập tay)<input id="bitrate" type="text" placeholder="vd: 50Mbps"></label>
  </div>
  <div class="actions">
    <button class="primary" id="run" disabled>Phân tích</button>
    <span id="status"></span>
  </div>
  <div id="out"></div>
</main>
<script>
const LABELS = {
  dark: ["Ảnh tối", "che kín ống kính"], white: ["Ảnh nền trắng", "sáng đều, không cháy"],
  red: ["Màn hình đỏ", ""], green: ["Màn hình xanh lá", ""], blue: ["Màn hình xanh dương", ""],
  t1: ["Nhiệt độ 1", "bề mặt đồng nhiệt"], t2: ["Nhiệt độ 2", "nhiệt độ khác t1"],
};
const TAB_NAMES = { hot: "Pixel nóng", dead: "Pixel chết", stuck: "Pixel kẹt", ir: "Camera nhiệt" };
const KIND_VI = { single: "đơn", cluster: "cụm", line: "đường" };
let MODES = {}, mode = null, files = {};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function selectMode(m) {
  mode = m; files = {};
  document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.m === m));
  $("frames-box").hidden = !MODES[m].frames;
  $("help").textContent = MODES[m].help[0].toUpperCase() + MODES[m].help.slice(1) + ".";
  $("slots").innerHTML = "";
  MODES[m].slots.forEach((slot) => $("slots").appendChild(makeSlot(slot)));
  $("out").innerHTML = ""; $("status").textContent = "";
  refresh();
}

function makeSlot(slot) {
  const [title, hint] = LABELS[slot] || [slot, ""];
  const el = document.createElement("label");
  el.className = "drop"; el.dataset.slot = slot;
  el.innerHTML = `<b>${esc(title)}</b><span class="hint">${esc(hint || "")}${hint ? " · " : ""}kéo thả hoặc bấm để chọn</span>
    <div class="count"></div><button class="clear" title="Xóa" hidden>×</button><input type="file" accept="image/*" multiple>`;
  const input = el.querySelector("input");
  input.onchange = () => setFiles(slot, input.files);
  el.ondragover = (e) => { e.preventDefault(); el.classList.add("over"); };
  el.ondragleave = () => el.classList.remove("over");
  el.ondrop = (e) => { e.preventDefault(); el.classList.remove("over"); setFiles(slot, e.dataTransfer.files); };
  el.querySelector(".clear").onclick = (e) => { e.preventDefault(); input.value = ""; setFiles(slot, []); };
  return el;
}

function setFiles(slot, list) {
  files[slot] = [...list].filter((f) => f.type.startsWith("image/") || /\.(png|jpe?g|bmp|tiff?)$/i.test(f.name))
    .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  refresh();
}

function refresh() {
  // Chế độ chọn được số ảnh: cần đủ số ảnh đã chọn; dư thì chỉ dùng các ảnh đầu theo tên
  const min = MODES[mode].frames ? Number($("frames").value) : MODES[mode].min;
  let ready = true;
  document.querySelectorAll(".drop").forEach((el) => {
    const n = (files[el.dataset.slot] || []).length;
    el.querySelector(".count").textContent = n ? `${n} ảnh` + (n < min ? ` (thiếu ${min - n})`
      : MODES[mode].frames && n > min ? ` (dùng ${min} ảnh đầu)` : "") : "";
    el.querySelector(".clear").hidden = !n;
    el.classList.toggle("ok", n >= min);
    if (n < min) ready = false;
  });
  $("run").disabled = !ready;
}

async function run() {
  const fd = new FormData();
  for (const slot of MODES[mode].slots) (files[slot] || []).forEach((f) => fd.append(slot, f, f.name));
  if (MODES[mode].frames) fd.append("frames", $("frames").value);
  fd.append("iso", $("iso").value); fd.append("bitrate", $("bitrate").value);
  $("run").disabled = true; $("out").innerHTML = "";
  $("status").innerHTML = '<span style="display:inline-flex;gap:8px;align-items:center"><span class="spin"></span>Đang tải ảnh lên và phân tích…</span>';
  const t0 = performance.now();
  try {
    const res = await fetch(`/api/analyze/${mode}`, { method: "POST", body: fd });
    const data = await res.json().catch(() => ({ error: `Lỗi máy chủ (HTTP ${res.status})` }));
    if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
    $("status").textContent = `Xong trong ${((performance.now() - t0) / 1000).toFixed(1)} giây.`;
    render(data);
  } catch (e) {
    $("status").textContent = "";
    $("out").innerHTML = `<div class="msg err"><b>Lỗi:</b> ${esc(e.message)}</div>`;
  } finally { refresh(); }
}

function render(data) {
  const out = $("out");
  const warns = data.notes.filter((n) => /^(WARNING|NOTE)/.test(n));
  const info = data.notes.filter((n) => !/^(WARNING|NOTE)/.test(n));
  out.innerHTML = warns.map((w) => `<div class="msg warn">${esc(w)}</div>`).join("") +
    `<div class="notes">${esc(data.info_text)}${info.length ? " · " + info.map(esc).join(" · ") : ""}</div>`;

  const cards = document.createElement("div"); cards.className = "cards";
  data.results.forEach((r) => {
    const s = r.summary, c = document.createElement("div");
    c.className = "card";
    c.innerHTML = `<h3><span class="dot" style="background:${r.color}"></span>${esc(r.name)}</h3>
      <div class="big">${s.total}</div>
      <div class="stats">vùng giữa (A): ${s.zoneA} · đơn: ${s.single} · cụm: ${s.cluster} · đường: ${s.line}</div>
      <button>Tải ${esc(r.name)}.json</button>`;
    c.querySelector("button").onclick = () => download(`${r.name}.json`,
      JSON.stringify({ info: data.info, summary: r.summary, defects: r.defects }, null, 1));
    cards.appendChild(c);
  });
  out.appendChild(cards);

  if (data.overlay) {
    const ov = document.createElement("div"); ov.className = "overlay";
    ov.innerHTML = `<img src="${data.overlay}" alt="Vị trí điểm lỗi">
      <p>Vòng tròn = vị trí lỗi (màu theo loại kết quả). Khung xám = vùng giữa A. Vẽ trên ảnh đầu tiên của bộ thứ nhất.</p>`;
    out.appendChild(ov);
  }

  data.results.filter((r) => r.defects.length).forEach((r) => {
    const d = document.createElement("details");
    const rows = r.defects.slice(0, 1000).map((p, i) =>
      `<tr><td>${i + 1}</td><td>${p.x}</td><td>${p.y}</td><td>${p.zone}</td><td>${KIND_VI[p.kind] || p.kind}</td><td>${p.size}</td></tr>`).join("");
    d.innerHTML = `<summary>Danh sách ${esc(r.name)} (${r.defects.length} điểm${r.defects.length > 1000 ? ", hiện 1000 đầu" : ""})</summary>
      <div class="tbl"><table><thead><tr><th>#</th><th>x</th><th>y</th><th>vùng</th><th>loại</th><th>số px</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    out.appendChild(d);
  });
}

function download(name, text) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// Chặn trình duyệt mở ảnh khi thả trượt ra ngoài ô
["dragover", "drop"].forEach((ev) => window.addEventListener(ev, (e) => e.preventDefault()));
$("run").onclick = run;
$("frames").onchange = refresh;

fetch("/api/modes").then((r) => r.json()).then((d) => {
  MODES = d.modes;
  Object.keys(MODES).forEach((m) => {
    const b = document.createElement("button");
    b.textContent = TAB_NAMES[m] || m; b.dataset.m = m; b.onclick = () => selectMode(m);
    $("tabs").appendChild(b);
  });
  selectMode(Object.keys(MODES)[0]);
}).catch(() => { $("out").innerHTML = '<div class="msg err">Không kết nối được máy chủ. Hãy chạy <code>python web_app.py</code>.</div>'; });
</script>
</body>
</html>
